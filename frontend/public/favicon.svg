<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Page Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Islamic Geometric Star Ring (Rub el Hizb Accent) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.45" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- 8-Pointed Star (Rub el Hizb) Background Geometry -->
  <g transform="translate(256, 256) scale(180) translate(-0.5, -0.5)" opacity="0.12">
    <rect x="0" y="0" width="1" height="1" fill="#fef08a" rx="0.08" />
    <rect x="0" y="0" width="1" height="1" fill="#fef08a" rx="0.08" transform="rotate(45 0.5 0.5)" />
  </g>

  <!-- Crescent & Star at the Top -->
  <g transform="translate(256, 115) scale(0.85)">
    <!-- Crescent -->
    <path d="M 0 -24 A 24 24 0 1 0 24 16 A 18 18 0 1 1 0 -24 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- 8-Point Mini Star inside Crescent -->
    <circle cx="6" cy="-4" r="4.5" fill="#fef08a" />
  </g>

  <!-- Central Open Quran (Noble Mushaf) -->
  <g transform="translate(256, 280) scale(1.15)">
    <!-- Quran Book Stand (Rihal) Underneath -->
    <path d="M -85 70 L -45 40 L 0 55 L 45 40 L 85 70 L 65 78 L 0 62 L -65 78 Z" fill="#b45309" opacity="0.85" />
    <path d="M -45 40 L 0 55 L 45 40 L 0 25 Z" fill="#78350f" opacity="0.9" />

    <!-- Left Page Outer Shadow -->
    <path d="M -10 18 C -55 5, -105 10, -115 15 C -118 20, -118 35, -112 -45 C -102 -50, -55 -55, -10 -40 Z" fill="#022c22" opacity="0.3" />

    <!-- Left Book Page -->
    <path d="M -6 14 C -45 2, -90 6, -108 10 C -112 -38, -105 -50, -102 -52 C -85 -55, -45 -50, -6 -38 Z" fill="#fefce8" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Left Page Script Lines -->
    <line x1="-92" y1="-38" x2="-22" y2="-30" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-94" y1="-24" x2="-22" y2="-16" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-96" y1="-10" x2="-22" y2="-2" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-92" y1="4" x2="-35" y2="9" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Right Book Page -->
    <path d="M 6 14 C 45 2, 90 6, 108 10 C 112 -38, 105 -50, 102 -52 C 85 -55, 45 -50, 6 -38 Z" fill="#fefce8" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Right Page Script Lines -->
    <line x1="22" y1="-30" x2="92" y2="-38" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="22" y1="-16" x2="94" y2="-24" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="22" y1="-2" x2="96" y2="-10" stroke="#064e3b" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="35" y1="9" x2="92" y2="4" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Binding Spine & Bookmark Ribbon -->
    <path d="M -6 -40 Q 0 -36 6 -40 L 6 18 Q 0 22 -6 18 Z" fill="#d97706" />
    <path d="M 0 18 L 8 45 L 0 40 L -8 45 Z" fill="#f59e0b" />
  </g>

  <!-- Noor Light Rays (Radiant Glow) -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="180" x2="256" y2="155" />
    <line x1="210" y1="195" x2="190" y2="175" />
    <line x1="302" y1="195" x2="322" y2="175" />
    <line x1="180" y1="230" x2="155" y2="225" />
    <line x1="332" y1="230" x2="357" y2="225" />
  </g>

  <!-- Arabic Calligraphy "نور القرآن" Subtext at bottom -->
  <text x="256" y="425" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif" font-size="34" font-weight="bold" fill="#fef08a" letter-spacing="1">
    نُورُ القُرْآن
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="3">
    NOOR-UL-QURAN
  </text>
</svg>